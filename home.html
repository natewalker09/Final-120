<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu</title>

<style>
body{
font-family:Arial;
background:#f4f4f4;
padding:20px;
}

h1{
text-align:center;
}

#menu{
display:flex;
flex-wrap:wrap;
gap:15px;
}

.item{
width:220px;
background:white;
padding:10px;
border-radius:10px;
box-shadow:0 0 5px gray;
text-align:center;
}

.item img{
width:200px;
height:130px;
border-radius:8px;
}

button{
background:green;
color:white;
border:none;
padding:8px;
border-radius:5px;
cursor:pointer;
}

#cart{
background:white;
padding:15px;
margin-top:20px;
border-radius:10px;
}

input{
display:block;
margin:5px 0;
padding:8px;
width:250px;
}
</style>

</head>
<body>

<h1>🌮 Azteca Roadhouse</h1>

<h2>Menu</h2>

<div id="menu"></div>

<div id="cart">

<h2>Shopping Cart</h2>

<ul id="cartItems"></ul>

<h3>Total: $<span id="total">0.00</span></h3>

<h2>Payment</h2>

<input id="name" placeholder="Name">
<input id="card" placeholder="Card Number">
<input id="exp" placeholder="MM/YY">
<input id="cvv" placeholder="CVV">

<button onclick="pay()">Pay Now</button>

<p id="message"></p>

</div>

<script>

const foodImage =
"https://via.placeholder.com/200x130?text=Azteca+Food";

const menu = [

["Beef Taco",3.50],
["Chicken Taco",3.00],
["Steak Taco",4.00],

["Cheese Quesadilla",8.00],
["Chicken Quesadilla",10.00],
["Steak Quesadilla",12.00],

["Beef Burrito",10.50],
["Chicken Burrito",11.00],
["Steak Burrito",12.50],

["Beef Nachos",10.00],
["Loaded Chicken Nachos",12.00],
["Guacamole & Chips",7.00],
["Mexican Street Corn",5.50],

["Mexican Rice Bowl",9.50],

["Chicken Fajitas",14.00],
["Steak Fajitas",16.00],

["Combo Plate",15.00],

["Beef Enchiladas (3)",13.00],
["Chicken Enchiladas (3)",13.50],

["Churros (2)",5.00]

];

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

function saveCart(){
localStorage.setItem(
"cart",
JSON.stringify(cart)
);
}

function showMenu(){

const menuDiv =
document.getElementById("menu");

menu.forEach((item,index)=>{

const div =
document.createElement("div");

div.className = "item";

div.innerHTML = `
<img src="${foodImage}">
<h3>${item[0]}</h3>
<p>$${item[1].toFixed(2)}</p>
<button onclick="addToCart(${index})">
Add To Cart
</button>
`;

menuDiv.appendChild(div);

});

}

function addToCart(index){

cart.push(menu[index]);

saveCart();

showCart();

}

function removeFromCart(index){

cart.splice(index,1);

saveCart();

showCart();

}

function showCart(){

const cartItems =
document.getElementById("cartItems");

cartItems.innerHTML = "";

let total = 0;

cart.forEach((item,index)=>{

total += item[1];

cartItems.innerHTML += `
<li>
${item[0]} - $${item[1].toFixed(2)}

<button onclick="removeFromCart(${index})">
Remove
</button>
</li>
`;

});

document.getElementById("total").innerText =
total.toFixed(2);

}

function pay(){

let name =
document.getElementById("name").value;

let card =
document.getElementById("card").value;

let exp =
document.getElementById("exp").value;

let cvv =
document.getElementById("cvv").value;

if(name && card && exp && cvv){

document.getElementById("message").innerHTML =
"✅ Payment Successful";

cart = [];

saveCart();

showCart();

}
else{

document.getElementById("message").innerHTML =
"❌ Fill out all payment fields";

}

}

showMenu();
showCart();

</script>

</body>
</html>
